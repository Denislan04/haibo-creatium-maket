<section class="hb-tech-scroll" id="hb-tech-story" data-hb-tech-scroll>
  <div class="hb-tech-scroll__sticky">
    <div class="hb-tech-scroll__layout">
      <header class="hb-tech-scroll__intro">
        <p class="hb-tech-scroll__eyebrow"><cr-embed name="tech_scroll_kicker"></cr-embed></p>
        <h2><cr-embed name="tech_scroll_title"></cr-embed></h2>

        <p class="hb-tech-scroll__video-error" data-hb-video-error hidden>Видео сейчас недоступно. Узлы мотора описаны справа.</p>

      <div class="hb-tech-scroll__details" aria-live="polite">
        <article data-hb-step data-time="1.8">
          <span class="hb-tech-scroll__number">01 / 05</span>
          <h3><cr-embed name="tech_scroll_1_title"></cr-embed></h3>
          <p><cr-embed name="tech_scroll_1_text"></cr-embed></p>
        </article>
        <article data-hb-step data-time="4.6" hidden>
          <span class="hb-tech-scroll__number">02 / 05</span>
          <h3><cr-embed name="tech_scroll_2_title"></cr-embed></h3>
          <p><cr-embed name="tech_scroll_2_text"></cr-embed></p>
        </article>
        <article data-hb-step data-time="6.8" hidden>
          <span class="hb-tech-scroll__number">03 / 05</span>
          <h3><cr-embed name="tech_scroll_3_title"></cr-embed></h3>
          <p><cr-embed name="tech_scroll_3_text"></cr-embed></p>
        </article>
        <article data-hb-step data-time="9.5" hidden>
          <span class="hb-tech-scroll__number">04 / 05</span>
          <h3><cr-embed name="tech_scroll_4_title"></cr-embed></h3>
          <p><cr-embed name="tech_scroll_4_text"></cr-embed></p>
        </article>
        <article data-hb-step data-time="12.6" hidden>
          <span class="hb-tech-scroll__number">05 / 05</span>
          <h3><cr-embed name="tech_scroll_5_title"></cr-embed></h3>
          <p><cr-embed name="tech_scroll_5_text"></cr-embed></p>

          <button type="button" data-hb-go="0" aria-current="step" aria-label="Первый узел">01</button>
          <button type="button" data-hb-go="1" aria-label="Второй узел">02</button>
          <button type="button" data-hb-go="2" aria-label="Третий узел">03</button>
          <button type="button" data-hb-go="3" aria-label="Четвёртый узел">04</button>
          <button type="button" data-hb-go="4" aria-label="Пятый узел">05</button>
